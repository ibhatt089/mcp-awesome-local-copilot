name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  pack-and-smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate plugin manifests
        shell: bash
        run: |
          for f in .mcp.json .vscode/mcp.json .cursor-plugin/plugin.json .claude-plugin/plugin.json .claude-plugin/marketplace.json */src/*/.mcp/server.json; do
            python -m json.tool "$f" > /dev/null && echo "valid $f"
          done

      - name: Pack
        shell: bash
        run: |
          for p in */src/*/*.HybridApp.csproj; do
            dotnet pack "$p" -c Release -o ./artifacts
          done

      - name: Smoke test through dnx
        run: python scripts/smoke_test.py ./artifacts
